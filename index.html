
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Plus Portal</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SheetJS Library for Excel Exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Google Sign-In Wall Overlay -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon"><i class="fa-solid fa-graduation-cap"></i></div>
      <h2 data-i18n="welcome">Welcome to Training Plus</h2>
      <p data-i18n="loginPrompt">Please sign in with Google to access your dashboard.</p>
      
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"></div>
    </div>
  </div>

  <!-- Main Portal Layout (Locked until authenticated) -->
  <div id="app" class="app-container hidden">
    
    <!-- Top Navigation Header -->
    <header class="navbar">
      <div class="nav-left">
        <button id="btn-home" class="nav-btn" onclick="loadStudents()">
          <i class="fa-solid fa-house"></i> <span data-i18n="home">Home</span>
        </button>
        <!-- Download All Students Data in Excel Style -->
        <button id="btn-download-all" class="nav-btn export-btn">
          <i class="fa-solid fa-file-excel"></i> <span data-i18n="downloadAll">Export All (Excel)</span>
        </button>
      </div>

      <div class="nav-right">
        <!-- AR / EN Language Toggle Button -->
        <button id="btn-lang-toggle" class="lang-btn"><i class="fa-solid fa-globe"></i> AR / EN</button>
        <button id="btn-signout" class="nav-btn danger-btn" onclick="signOut()">
          <i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="signOut">Sign Out</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
      
      <!-- Student Management Panel -->
      <section class="card student-section">
        <h2 data-i18n="addStudentHeader"><i class="fa-solid fa-user-plus"></i> Add New Student</h2>
        <form id="student-form" class="form-grid">
          <input type="text" id="student-name" placeholder="Student Name" required>
          <input type="email" id="student-email" placeholder="Student Email" required>
          <input type="text" id="student-course" placeholder="Course / Track" required>
          <button type="submit" class="btn-primary" data-i18n="addStudentBtn">Add Student</button>
        </form>

        <h2 data-i18n="myStudentsHeader"><i class="fa-solid fa-users"></i> My Students</h2>
        <div class="table-container">
          <table id="students-table">
            <thead>
              <tr>
                <th data-i18n="thName">Name</th>
                <th data-i18n="thEmail">Email</th>
                <th data-i18n="thCourse">Course</th>
                <th data-i18n="thActions">Actions</th>
              </tr>
            </thead>
            <tbody id="students-list">
              <!-- Dynamically Populated Rows -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Private Chat & Direct Student Sharing Panel -->
      <section class="card chat-section">
        <h2 data-i18n="chatHeader"><i class="fa-solid fa-comments"></i> Private Direct Messages</h2>
        <div class="chat-container">
          
          <!-- Users List Sidebar -->
          <div class="chat-sidebar">
            <p class="sidebar-title" data-i18n="selectUserTitle">Select Team Member</p>
            <ul id="users-ul" class="users-list"></ul>
          </div>

          <!-- Private Chat Window & Drop Area -->
          <div class="chat-window" id="chat-window" ondragover="allowDrop(event)" ondrop="dropStudent(event)">
            <div class="chat-header" id="chat-header-title" data-i18n="selectUserHint">
              Select a user from the list to open a private chat
            </div>
            
            <div class="chat-messages" id="chat-messages">
              <!-- Chat Bubbles & Shared Student Cards -->
            </div>

            <div class="chat-input-area">
              <input type="text" id="chat-input" placeholder="Type a message or drag a student here..." disabled>
              <button id="btn-send-msg" class="btn-primary" disabled><i class="fa-solid fa-paper-plane"></i></button>
            </div>
          </div>

        </div>
      </section>

    </main>

    <!-- Toast Notification Popup -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
